<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>סקר ארכיאולוגי בשטח</title>
  <meta name="theme-color" content="#2c3e50">
  
  <!-- Leaflet CSS & JS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 70px; }
    
    header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { margin-bottom: 12px; color: #2c3e50; font-size: 1.1rem; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
    
    label { display: block; margin-top: 10px; font-weight: 600; font-size: 0.9rem; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    textarea { resize: vertical; min-height: 80px; }
    
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    
    button { background-color: #27ae60; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; transition: background 0.2s; }
    button:active { opacity: 0.8; }
    button.btn-gps { background-color: #2980b9; margin-top: 5px; }
    button.btn-cancel { background-color: #7f8c8d; margin-top: 5px; }
    button.btn-export { background-color: #e67e22; }
    button.btn-danger { background-color: #c0392b; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #ddd; z-index: 1000; }
    .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 0.9rem; color: #7f8c8d; text-decoration: none; font-weight: bold; cursor: pointer; }
    .nav-item.active { color: #2980b9; background-color: #ebf5fb; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    #map { height: 350px; width: 100%; border-radius: 8px; margin-top: 10px; }
    
    .point-item { border-right: 4px solid #2980b9; padding: 10px; background: #fafafa; margin-bottom: 10px; border-radius: 4px; position: relative; }
    .point-item img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-top: 8px; }
    .point-actions { display: flex; gap: 8px; margin-top: 8px; }
    .point-actions button { padding: 6px 10px; font-size: 0.85rem; margin-top: 0; }
    
    .img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
    .gps-info { font-size: 0.8rem; color: #27ae60; margin-top: 4px; font-weight: bold; }
    .badge { display: inline-block; padding: 3px 8px; background: #e0e0e0; border-radius: 12px; font-size: 0.75rem; margin-top: 4px; }
  </style>
</head>
<body>

  <header>סקר ארכיאולוגי בשטח</header>

  <div class="container">
    
    <!-- טאב 1: הוספת/עריכת נקודה -->
    <div id="tab-add" class="tab-content active">
      <div class="card">
        <h3 id="form-title">הוספת נקודת סקר</h3>
        <form id="survey-form">
          <input type="hidden" id="point-id">
          
          <label>מזהה / שם הנקודה *</label>
          <input type="text" id="point-name" placeholder="לדוגמה: לוקוס 101 / קיר אבני גזית" required>
          
          <label>סוג הממצא</label>
          <select id="find-type">
            <option value="חרסים">חרסים / קרמיקה</option>
            <option value="מבנה/קיר">מבנה / קיר</option>
            <option value="מתקן חקלאי">מתקן חקלאי (גת, בית בד וכד')</option>
            <option value="מערה/בור">מערה / בור מים</option>
            <option value="מטבע/מתכת">מטבע / חפץ מתכת</option>
            <option value="עצמות/אורגני">שרידים אורגניים / עצמות</option>
            <option value="אחר">אחר</option>
          </select>

          <label>מיקום GPS (נ"צ)</label>
          <button type="button" class="btn-gps" onclick="getLocation()">📍 דגום מיקום נוכחי</button>
          <div id="gps-status" class="gps-info"></div>
          
          <div class="row">
            <div>
              <label>קו רוחב (Lat)</label>
              <input type="number" step="any" id="lat" placeholder="31.7683" required>
            </div>
            <div>
              <label>קו אורך (Lng)</label>
              <input type="number" step="any" id="lng" placeholder="35.2137" required>
            </div>
          </div>
          <div class="row">
            <div>
              <label>גובה (מטרים)</label>
              <input type="number" step="any" id="alt" placeholder="0">
            </div>
            <div>
              <label>דיוק (מטרים)</label>
              <input type="number" step="any" id="acc" placeholder="0" readonly>
            </div>
          </div>

          <label>תמונה</label>
          <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handleImage(event)">
          <img id="img-preview" class="img-preview" alt="תצוגה מקדימה">

          <label>תקופה משוערת</label>
          <input type="text" id="period" placeholder="לדוגמה: ברזל ב', ביזנטי, רומי">

          <label>מצב השתמרות</label>
          <select id="preservation">
            <option value="טוב מאוד">טוב מאוד</option>
            <option value="בינוני">בינוני</option>
            <option value="הרוס/גרוע">הרוס / גרוע</option>
          </select>

          <label>הערות ותיאור מפורט</label>
          <textarea id="notes" placeholder="תיאור הממצא, מידות, מאפיינים מיוחדים..."></textarea>

          <button type="submit" id="btn-save">💾 שמור נקודה</button>
          <button type="button" id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">ביטול עריכה</button>
        </form>
      </div>
    </div>

    <!-- טאב 2: רשימה -->
    <div id="tab-list" class="tab-content">
      <div class="card">
        <h3>רשימת נקודות שנאספו</h3>
        <input type="text" id="search-input" placeholder="🔍 חפש לפי שם, תיאור או תקופה..." oninput="renderList()">
        <div id="points-container" style="margin-top: 15px;"></div>
      </div>
    </div>

    <!-- טאב 3: מפה -->
    <div id="tab-map" class="tab-content">
      <div class="card">
        <h3>מפת נקודות בשטח</h3>
        <div id="map"></div>
      </div>
    </div>

    <!-- טאב 4: ייצוא וגיבוי -->
    <div id="tab-export" class="tab-content">
      <div class="card">
        <h3>ייצוא נתונים (Export)</h3>
        <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">כשתתחבר לאינטרנט/בסוף יום הסקר, תוכל לייצא את המידע לתוכנות אקסל ו-GIS:</p>
        
        <button class="btn-export" onclick="exportCSV()">📊 ייצא לאקסל (CSV)</button>
        <button class="btn-export" style="background-color: #8e44ad;" onclick="exportGeoJSON()">🗺️ ייצא ל-GeoJSON (QGIS/ArcGIS)</button>
        <button class="btn-export" style="background-color: #16a085;" onclick="exportKML()">🌍 ייצא ל-KML (Google Earth)</button>
        <button class="btn-export" style="background-color: #34495e;" onclick="exportJSONBackup()">💾 גיבוי מלא (JSON כולל תמונות)</button>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>שחזור / ייבוא גיבוי</h3>
        <input type="file" id="import-file" accept=".json" onchange="importJSONBackup(event)">
      </div>
    </div>

  </div>

  <!-- תפריט ניווט תחתון -->
  <nav class="nav-bar">
    <div class="nav-item active" onclick="switchTab('tab-add', this)">➕ הוספה</div>
    <div class="nav-item" onclick="switchTab('tab-list', this)">📋 רשימה</div>
    <div class="nav-item" onclick="switchTab('tab-map', this)">🗺️ מפה</div>
    <div class="nav-item" onclick="switchTab('tab-export', this)">📤 ייצוא</div>
  </nav>

  <script>
    // --- IndexedDB setup ---
    let db;
    const dbReq = indexedDB.open("ArchaeoSurveyDB", 1);
    
    dbReq.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("points")) {
        db.createObjectStore("points", { keyPath: "id", autoIncrement: true });
      }
    };
    
    dbReq.onsuccess = function(e) {
      db = e.target.result;
      renderList();
    };

    let currentImageData = "";
    let mapInstance = null;
    let markersGroup = null;

    // --- Tab Switching ---
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');

      if (tabId === 'tab-list') renderList();
      if (tabId === 'tab-map') initMap();
    }

    // --- GPS Handler ---
    function getLocation() {
      const status = document.getElementById('gps-status');
      if (!navigator.geolocation) {
        status.innerText = "GPS אינו נתמך בדפדפן זה";
        return;
      }
      status.innerText = "מאתר מיקום...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('lat').value = pos.coords.latitude;
          document.getElementById('lng').value = pos.coords.longitude;
          document.getElementById('alt').value = pos.coords.altitude ? pos.coords.altitude.toFixed(1) : 0;
          document.getElementById('acc').value = pos.coords.accuracy ? pos.coords.accuracy.toFixed(1) : 0;
          status.innerText = `מיקום נקלט בדיוק של ${pos.coords.accuracy.toFixed(1)} מטרים`;
        },
        (err) => {
          status.innerText = "שגיאה בקליטת GPS: " + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // --- Image Resize & Compression ---
    function handleImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1000;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentImageData = canvas.toDataURL('image/jpeg', 0.7);
          const preview = document.getElementById('img-preview');
          preview.src = currentImageData;
          preview.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- Save / Update Point ---
    document.getElementById('survey-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const id = document.getElementById('point-id').value;
      const pointData = {
        name: document.getElementById('point-name').value,
        findType: document.getElementById('find-type').value,
        lat: parseFloat(document.getElementById('lat').value),
        lng: parseFloat(document.getElementById('lng').value),
        alt: parseFloat(document.getElementById('alt').value) || 0,
        acc: parseFloat(document.getElementById('acc').value) || 0,
        period: document.getElementById('period').value,
        preservation: document.getElementById('preservation').value,
        notes: document.getElementById('notes').value,
        image: currentImageData,
        timestamp: new Date().toLocaleString('he-IL')
      };

      const tx = db.transaction("points", "readwrite");
      const store = tx.objectStore("points");

      if (id) {
        pointData.id = parseInt(id);
        store.put(pointData);
      } else {
        store.add(pointData);
      }

      tx.oncomplete = function() {
        alert(id ? "הנקודה עודכנה בהצלחה!" : "הנקודה שנשמרה בהצלחה!");
        resetForm();
      };
    });

    function resetForm() {
      document.getElementById('survey-form').reset();
      document.getElementById('point-id').value = '';
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('gps-status').innerText = '';
      document.getElementById('form-title').innerText = 'הוספת נקודת סקר';
      document.getElementById('btn-save').innerText = '💾 שמור נקודה';
      document.getElementById('btn-cancel').style.display = 'none';
      currentImageData = "";
    }

    // --- Render List ---
    function renderList() {
      const container = document.getElementById('points-container');
      const search = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      const tx = db.transaction("points", "readonly");
      const store = tx.objectStore("points");
      const req = store.openCursor(null, 'prev');

      req.onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          const item = cursor.value;
          if (!search || item.name.toLowerCase().includes(search) || item.notes.toLowerCase().includes(search) || item.period.toLowerCase().includes(search)) {
            const div = document.createElement('div');
            div.className = 'point-item';
            div.innerHTML = `
              <strong>${item.name}</strong> <span class="badge">${item.findType}</span>
              <br><small>📅 ${item.timestamp} | 📍 ${item.lat.toFixed(5)}, ${item.lng.toFixed(5)} (${item.alt}m)</small>
              ${item.period ? `<br><small>⏳ תקופה: ${item.period}</small>` : ''}
              ${item.notes ? `<p style="margin-top:5px;">${item.notes}</p>` : ''}
              ${item.image ? `<img src="${item.image}">` : ''}
              <div class="point-actions">
                <button onclick="editPoint(${item.id})">✏️ ערוך</button>
                <button class="btn-danger" onclick="deletePoint(${item.id})">🗑️ מחק</button>
              </div>
            `;
            container.appendChild(div);
          }
          cursor.continue();
        } else if (container.children.length === 0) {
          container.innerHTML = '<p style="color:#777; text-align:center;">לא נמצאו נקודות סקר.</p>';
        }
      };
    }

    // --- Edit & Delete ---
    function editPoint(id) {
      const tx = db.transaction("points", "readonly");
      const store = tx.objectStore("points");
      store.get(id).onsuccess = function(e) {
        const p = e.target.result;
        document.getElementById('point-id').value = p.id;
        document.getElementById('point-name').value = p.name;
        document.getElementById('find-type').value = p.findType;
        document.getElementById('lat').value = p.lat;
        document.getElementById('lng').value = p.lng;
        document.getElementById('alt').value = p.alt;
        document.getElementById('acc').value = p.acc;
        document.getElementById('period').value = p.period;
        document.getElementById('preservation').value = p.preservation;
        document.getElementById('notes').value = p.notes;
        
        if (p.image) {
          currentImageData = p.image;
          const preview = document.getElementById('img-preview');
          preview.src = p.image;
          preview.style.display = 'block';
        }

        document.getElementById('form-title').innerText = 'עריכת נקודה #' + p.id;
        document.getElementById('btn-save').innerText = '💾 עדכן נקודה';
        document.getElementById('btn-cancel').style.display = 'block';

        switchTab('tab-add', document.querySelectorAll('.nav-item')[0]);
      };
    }

    function deletePoint(id) {
      if (confirm("האם אתה בטוח שברצונך למחוק נקודה זו?")) {
        const tx = db.transaction("points", "readwrite");
        tx.objectStore("points").delete(id);
        tx.oncomplete = function() { renderList(); };
      }
    }

    // --- Map Implementation ---
    function initMap() {
      if (!mapInstance) {
        mapInstance = L.map('map').setView([31.7683, 35.2137], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(mapInstance);
        markersGroup = L.featureGroup().addTo(mapInstance);
      }

      markersGroup.clearLayers();
      const tx = db.transaction("points", "readonly");
      const store = tx.objectStore("points");
      
      store.openCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          const p = cursor.value;
          const marker = L.marker([p.lat, p.lng]).bindPopup(`
            <b>${p.name}</b><br>
            ${p.findType}<br>
            ${p.notes ? p.notes + '<br>' : ''}
            ${p.image ? `<img src="${p.image}" style="width:100px;margin-top:5px;border-radius:4px;">` : ''}
          `);
          markersGroup.addLayer(marker);
          cursor.continue();
        } else {
          if (markersGroup.getLayers().length > 0) {
            mapInstance.fitBounds(markersGroup.getBounds().pad(0.1));
          }
        }
      };

      setTimeout(() => mapInstance.invalidateSize(), 300);
    }

    // --- EXPORTS ---

    function getAllPoints(callback) {
      const tx = db.transaction("points", "readonly");
      const store = tx.objectStore("points");
      const req = store.getAll();
      req.onsuccess = function() { callback(req.result); };
    }

    function downloadFile(content, fileName, contentType) {
      const a = document.createElement("a");
      const file = new Blob([content], { type: contentType });
      a.href = URL.createObjectURL(file);
      a.download = fileName;
      a.click();
    }

    // Export CSV (Excel)
    function exportCSV() {
      getAllPoints(points => {
        if (!points.length) return alert("אין נתונים לייצוא");
        let csv = "\uFEFF"; // UTF-8 BOM for Excel
        csv += "ID,שם,סוג ממצא,קו רוחב,קו אורך,גובה,דיוק,תקופה,מצב השתמרות,הערות,זמן דגימה\n";

        points.forEach(p => {
          const cleanNotes = (p.notes || "").replace(/"/g, '""');
          csv += `"${p.id}","${p.name}","${p.findType}","${p.lat}","${p.lng}","${p.alt}","${p.acc}","${p.period}","${p.preservation}","${cleanNotes}","${p.timestamp}"\n`;
        });

        downloadFile(csv, `archaeo_survey_${Date.now()}.csv`, "text/csv;charset=utf-8;");
      });
    }

    // Export GeoJSON
    function exportGeoJSON() {
      getAllPoints(points => {
        if (!points.length) return alert("אין נתונים לייצוא");
        const geojson = {
          type: "FeatureCollection",
          features: points.map(p => ({
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [p.lng, p.lat, p.alt || 0]
            },
            properties: {
              id: p.id,
              name: p.name,
              findType: p.findType,
              period: p.period,
              preservation: p.preservation,
              notes: p.notes,
              timestamp: p.timestamp
            }
          }))
        };
        downloadFile(JSON.stringify(geojson, null, 2), `archaeo_survey_${Date.now()}.geojson`, "application/json");
      });
    }

    // Export KML
    function exportKML() {
      getAllPoints(points => {
        if (!points.length) return alert("אין נתונים לייצוא");
        let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>סקר ארכיאולוגי</name>`;

        points.forEach(p => {
          kml += `
    <Placemark>
      <name>${p.name}</name>
      <description><![CDATA[
        סוג: ${p.findType}<br>
        תקופה: ${p.period}<br>
        הערות: ${p.notes}<br>
        זמן: ${p.timestamp}
      ]]></description>
      <Point>
        <coordinates>${p.lng},${p.lat},${p.alt || 0}</coordinates>
      </Point>
    </Placemark>`;
        });

        kml += `
  </Document>
</kml>`;
        downloadFile(kml, `archaeo_survey_${Date.now()}.kml`, "application/vnd.google-earth.kml+xml");
      });
    }

    // Backup & Restore
    function exportJSONBackup() {
      getAllPoints(points => {
        downloadFile(JSON.stringify(points, null, 2), `archaeo_full_backup_${Date.now()}.json`, "application/json");
      });
    }

    function importJSONBackup(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const points = JSON.parse(event.target.result);
          if (Array.isArray(points)) {
            const tx = db.transaction("points", "readwrite");
            const store = tx.objectStore("points");
            points.forEach(p => {
              delete p.id;
              store.add(p);
            });
            tx.oncomplete = function() {
              alert("הנתונים שוחזרו בהצלחה!");
              renderList();
            };
          }
        } catch (err) {
          alert("קובץ לא תקין!");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
